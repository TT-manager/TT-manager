<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>PongFu</title>
<style>
  html, body { margin: 0; height: 100%; background: #111113; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  img { height: 44px; width: auto; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; max-width: 20rem; color: rgba(255, 255, 255, .72); line-height: 1.45; }
  button { margin-top: 10px; border: 0; border-radius: 8px; padding: 12px 22px; font: inherit; font-weight: 700; color: #fff; background: #d6181f; }
</style>
</head>
<body>
<main>
  <img src="/logo-scuro.svg" alt="PongFu" width="166" height="44">
  <h1 id="t">Nessuna connessione</h1>
  <p id="p">Non riesco a raggiungere PongFu. Controlla la rete e riprova.</p>
  <button id="b" type="button">Riprova</button>
</main>
<script>
  // Lingua del telefono: italiano o inglese.
  if (!/^it/i.test(navigator.language || "it")) {
    document.documentElement.lang = "en";
    document.getElementById("t").textContent = "No connection";
    document.getElementById("p").textContent = "Can't reach PongFu. Check your network and try again.";
    document.getElementById("b").textContent = "Try again";
  }
  document.getElementById("b").addEventListener("click", () => location.reload());
  // Appena la rete torna, si riprova da soli.
  window.addEventListener("online", () => location.reload());
</script>
</body>
</html>
